name: verify
on: [push, pull_request]
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run full verification (single source of truth)
        run: tools/verify.sh
  isabelle:
    runs-on: ubuntu-latest
    container:
      image: makarius/isabelle:Isabelle2025-2
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - run: isabelle build -D kernel/isabelle -v
