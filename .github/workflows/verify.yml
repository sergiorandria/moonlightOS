name: verify
on: [push, pull_request]
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps (clang + QEMU for kernel smoke)
        run: sudo apt-get update && sudo apt-get install -y qemu-system-misc
      - name: Run full verification (single source of truth)
        run: tools/verify.sh
  # NOTE (PLAN 1.4): host-tests is the single source of truth — do not
  # re-implement its test list here. The isabelle job below is a matrix
  # extension, not a duplicate: verify.sh SKIPs proofs when Isabelle is
  # absent, and this container provides it. There is a single kernel
  # spec session (`kernel/isabelle`); no separate v2 tree.
  isabelle:
    runs-on: ubuntu-latest
    container:
      image: makarius/isabelle:Isabelle2025-2
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - run: isabelle build -D kernel/isabelle -v
