name: verify
on: [push, pull_request]
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: gcc -I kernel/include -o /tmp/test_cap tests/test_cap.c kernel/src/cap.c kernel/src/cnode.c kernel/src/alloc.c kernel/src/sched.c kernel/src/iommu.c kernel/src/irq.c kernel/src/cheri.c && /tmp/test_cap
      - run: gcc -I kernel/include -o /tmp/test_sched tests/test_sched_realtime.c kernel/src/sched.c kernel/src/cheri.c && /tmp/test_sched
      - run: gcc -I kernel/include -o /tmp/test_revoke tests/test_revoke_process.c kernel/src/revoke.c kernel/src/process.c kernel/src/sched.c kernel/src/alloc.c kernel/src/cheri.c kernel/src/tcb.c && /tmp/test_revoke
      - run: gcc -I kernel/include -o /tmp/host_emul tests/host_emul.c kernel/src/revoke.c kernel/src/process.c kernel/src/sched.c kernel/src/alloc.c kernel/src/cheri.c kernel/src/tcb.c kernel/src/cnode.c kernel/src/cap.c kernel/src/endpoint.c && /tmp/host_emul
      - run: gcc -I kernel/include -o /tmp/fuzz tests/fuzz_syscall.c kernel/src/syscall.c kernel/src/cap.c kernel/src/cnode.c kernel/src/tcb.c kernel/src/endpoint.c kernel/src/sched.c kernel/src/cheri.c kernel/src/vspace.c && /tmp/fuzz
  isabelle:
    runs-on: ubuntu-latest
    container: makarius/isabelle:Isabelle2024
    steps:
      - uses: actions/checkout@v4
      - run: isabelle build -D kernel/isabelle
